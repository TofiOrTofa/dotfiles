# ===================================================================
# 1. НАСТРОЙКА ДВУХ ПРЕФИКСОВ (ЛИДЕРОВ)
# ===================================================================
set -g prefix C-Space
set -g prefix2 M-Space
bind C-Space send-prefix
bind M-Space send-prefix -2

# ===================================================================
# 2. ПЕРВЫЙ ЛИДЕР: Ctrl + Space (Работа внутри ОДНОЙ вкладки)
# ===================================================================
# Разделение экрана (v - горизонтально, h - вертикально)
bind -T prefix C-h split-window -v -c "#{pane_current_path}"
bind -T prefix C-v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

bind -T prefix C-f select-pane -R  # Forward (вправо)
bind -T prefix C-b select-pane -L  # Backward (влево)
bind -T prefix C-p select-pane -U  # Previous line (вверх)
bind -T prefix C-n select-pane -D  # Next line (вниз)

# ===================================================================
# 3. ВТОРОЙ ЛИДЕР: Ctrl + b (Глобальное управление: вкладки и сессии)
# ===================================================================
# Работа с вкладками (в Tmux они называются windows)
bind -T prefix2 c new-window -c "#{pane_current_path}" # c -> Создать вкладку
bind -T prefix2 n next-window                          # n -> Следующая вкладка
bind -T prefix2 p previous-window                      # p -> Предыдущая вкладка

# Работа с сессиями
bind -T prefix2 d detach-client                        # d -> Детач (выйти из сессии, оставив её жить)

# ===================================================================
# 4. ПОЛНЫЙ ВЫХОД И ТЕХНИЧЕСКИЕ НАСТРОЙКИ
# ===================================================================
# Полный выход из Tmux (убивает всю сессию целиком)
# Нажимаем Ctrl + Space, а затем Ctrl + q
bind -T prefix2 C-q kill-session

# Отзывчивость и мышь
set -g mouse on
set -s escape-time 0

# ===================================================================
# 5. ВИЗУАЛЬНЫЕ ИНДИКАТОРЫ ДЛЯ ЛИДЕРОВ (STATUS BAR)
# ===================================================================
# Включаем строку состояния и настраиваем её обновление раз в 0.5 секунд
set -g status on
set -g status-interval 1

# Настройка правой части статус-бара:
# Если нажат первый лидер (C-Space), покажет [SPACE] красным цветом
# Если нажат второй лидер (C-b), покажет [GLOBAL] синим цветом
# Если ничего не нажато, индикатор будет пустой
set -g status-right "#{?client_prefix,#[fg=red]#[bold][LOCAL]#[fg=default],#{?#{==:#{prefix_current},2},#[fg=blue]#[bold][GLOBAL]#[fg=default],}}"

